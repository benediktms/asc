name: Direct delivery verification workspace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'impl/direct-peer-delivery' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - run: bun install --frozen-lockfile
      - name: Export public source and pinned tools for offline verification
        shell: bash
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/acs-verification-workspace"
          mkdir -p "$destination/.verification-tools"
          git archive HEAD | tar -x -C "$destination"
          cp -a node_modules "$destination/node_modules"
          cp "$(command -v bun)" "$destination/.verification-tools/bun"
          printf '%s\n' "$(git rev-parse HEAD)" > "$destination/.verification-tools/source-sha"
          tar -czf "${RUNNER_TEMP}/acs-verification-workspace.tar.gz" -C "$destination" .
      - uses: actions/upload-artifact@v4
        with:
          name: acs-verification-workspace
          path: ${{ runner.temp }}/acs-verification-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
