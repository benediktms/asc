name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - run: bun install --frozen-lockfile
      - run: mise run specs:check
      - run: bun run check

  native-codex:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        codex: ["0.153.2", "0.153.4"]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - run: bun install --frozen-lockfile
      - name: Install selected native Codex fixture
        shell: bash
        env:
          CODEX_VERSION: ${{ matrix.codex }}
        run: |
          mkdir -p "$RUNNER_TEMP/acs-native-fixture"
          cd "$RUNNER_TEMP/acs-native-fixture"
          printf '{"private":true}\n' > package.json
          bun add --exact "@openai/codex@$CODEX_VERSION"
          echo "ACS_CODEX_BINARY=$RUNNER_TEMP/acs-native-fixture/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Real binary against local mock model (no account credentials)
        env:
          ACS_REAL_CODEX: "1"
          ACS_EXPECTED_CODEX_VERSION: ${{ matrix.codex }}
        run: bun test tests/real-codex.test.ts

  a2a-tck:
    runs-on: ubuntu-latest
    env:
      A2A_TCK_DIR: /tmp/a2a-tck
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - run: bun install --frozen-lockfile
      - run: git clone https://github.com/a2aproject/a2a-tck.git "$A2A_TCK_DIR"
      - run: git checkout 263b9cfaf16a554bdfb166a7ba5b67716e946349
        working-directory: ${{ env.A2A_TCK_DIR }}
      - run: uv sync --frozen --python "$(command -v python)" --directory "$A2A_TCK_DIR"
      - run: bun run test:a2a-tck

  release-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - run: bun install --frozen-lockfile
      - run: bun run release -- --target "${{ matrix.target }}"
      - run: test -s "dist/release/${{ matrix.target }}/acs"
      - run: test -s "dist/release/${{ matrix.target }}/LICENSE"
      - run: test -s "dist/release/${{ matrix.target }}/THIRD_PARTY_NOTICES"
      - run: shasum -a 256 -c SHA256SUMS
        working-directory: dist/release/${{ matrix.target }}
