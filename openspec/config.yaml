schema: spec-driven

context: |
  ACS (Agent Communications Service) provides local-first A2A messaging between
  independently launched Codex threads. It is a TypeScript/Bun monorepo compiled
  to a standalone binary, with Bun's native SQLite driver and no ORM.
  openspec/specs is the sole normative source of truth for behavioral and
  architectural requirements; propose future changes under openspec/changes.
  README/operator docs, docs/threat-model.md, typed contracts, tests, and code are
  supporting artifacts that must conform to OpenSpec rather than define parallel
  requirements. A2A JSON-RPC is the inter-agent data plane; authenticated
  Unix-socket JSON-RPC handles local administration. Only runtime adapters import
  harness-specific generated protocol types. Peer messages are untrusted runtime
  input, never permission or local-user authority.
  Tool versions are pinned in mise.toml; package versions are pinned in
  package.json and bun.lock. Codex schema generation targets 0.153.2.
  Preserve caller attestation, binding fences, local permission ownership, and
  ambiguous acceptance recovery. Do not claim new compatibility without
  conformance evidence.

rules:
  specs:
    - Write observable requirements with at least one WHEN/THEN scenario each.
    - Distinguish durable message acceptance from runtime execution acceptance.
    - Put durable architectural constraints in OpenSpec, not ADRs or implementation comments.
  tasks:
    - Include targeted tests for changed behavior and strict OpenSpec validation.
    - Run only affected test files locally; the full suite runs in CI.
